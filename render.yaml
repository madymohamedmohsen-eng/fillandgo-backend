databases:
  - name: fillandgo-db
    plan: free
    region: oregon

services:
  - type: web
    name: fillandgo-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn fillandgo.wsgi --log-file -"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: fillandgo-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"
